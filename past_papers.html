<header class="py-5 text-center bg-light">
  <div class="container">
    <h1 class="display-5">Past Exam Papers</h1>
    <p class="lead">Search by course, semester, or free text.</p>
  </div>
</header>

<section class="py-4">
  <div class="container">
    <form id="search-form" class="row g-3 align-items-end">
      <div class="col-md-3">
        <label for="course" class="form-label">Course Code / Name</label>
        <input type="text" id="course" class="form-control" placeholder="e.g. ECE101 or programming" />
      </div>
      <div class="col-md-2">
        <label for="semester" class="form-label">Semester</label>
        <select id="semester" class="form-select">
          <option value="">Any</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>
      <div class="col-md-2">
        <label for="year" class="form-label">Year</label>
        <select id="year" class="form-select"><option value="">Any</option></select>
      </div>
      <div class="col-md-2">
        <label for="sort" class="form-label">Sort</label>
        <select id="sort" class="form-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-fill">Search</button>
        <button type="button" id="clear-filters" class="btn btn-outline-secondary flex-fill">Clear</button>
      </div>
    </form>

    <div class="mt-4" id="results-info"></div>
    <div class="row mt-3" id="papers-list"></div>
  </div>
</section>

<footer class="py-4 bg-primary text-white text-center">

  <p class="mb-0">&copy; 2025 SHMMy Students</p>

  <button id="contrast-toggle" class="btn btn-outline-light btn-sm ms-2">High Contrast</button>
  </div>
</footer>
