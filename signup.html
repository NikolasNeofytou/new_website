<section class="py-5">
    <div class="container">
        <h2 class="mb-4">Create Your Profile</h2>
        <form id="profile-form" class="mb-5">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-md-2">
                    <label for="univid" class="form-label">University ID</label>
                    <input type="text" class="form-control" id="univid" required>
                </div>
                <div class="col-md-2">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="col-md-2">
                    <label for="year" class="form-label">Year</label>
                    <select id="year" class="form-select" required>
                        <option value="" disabled selected>Select...</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="spec" class="form-label">Specialisation</label>
                    <select id="spec" class="form-select" required>
                        <option value="" disabled selected>Select...</option>
                        <option>Power Systems</option>
                        <option>Telecommunications</option>
                        <option>Computer Systems</option>
                        <option>Electronics</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="photo-choice" class="form-label">Photo</label>
                    <select id="photo-choice" class="form-select mb-2">
                        <option value="default1">Blue Bolt</option>
                        <option value="default2">Green Chip</option>
                        <option value="default3">Orange Gear</option>
                        <option value="upload">Upload your own</option>
                    </select>
                    <input type="file" id="photo-upload" class="form-control d-none" accept="image/*">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </form>
    </div>
</section>
