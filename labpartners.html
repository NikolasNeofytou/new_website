<section class="py-5">
    <div class="container">
        <h2 class="mb-4">Find a Lab Partner</h2>
        <form id="partner-form" class="mb-5">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="course" class="form-label">Course</label>
                    <input type="text" class="form-control" id="course" required>
                </div>
                <div class="col-md-2">
                    <label for="teamSize" class="form-label">Team Size</label>
                    <input type="number" class="form-control" id="teamSize" min="1" max="10" required>
                </div>
                <div class="col-md-3">
                    <label for="type" class="form-label">I'm</label>
                    <select id="type" class="form-select" required>
                        <option value="looking">Looking for a team</option>
                        <option value="team">Team seeking member</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="contact" class="form-label">Contact Email</label>
                    <input type="email" class="form-control" id="contact" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Post</button>
                </div>
            </div>
        </form>
        <div id="posts" class="row g-3">
            <!-- Posts loaded via labpartners.js -->
        </div>
    </div>
</section>

<section class="py-5 text-center ad-banner" id="ads">
    <div class="container">
