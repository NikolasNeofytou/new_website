<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SHMMy Forum Enhanced</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">SHMMy</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="announcements.html">Announcements</a></li>
                <li class="nav-item"><a class="nav-link" href="https://shmmy.ntua.gr/forum/">Forum</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                <li class="nav-item" id="auth-li"><button id="auth-btn" class="btn btn-outline-light btn-sm">Sign In</button></li>
            </ul>
        </div>
    </div>
</nav>

<header class="py-5 text-center bg-light">
    <div class="container">
        <h1 class="display-4">User Profile</h1>
        <p class="lead">This is your profile page.</p>
    </div>
</header>

<section class="py-5">
    <div class="container" id="profile-root">
        <h2 class="h4 mb-3">Your Details</h2>
        <div class="mb-3">
            <p id="profile-email" class="mb-1 small text-muted"></p>
            <p id="profile-id" class="mb-0 small text-muted"></p>
        </div>
        <div class="mb-4">
            <button id="load-profile" class="btn btn-primary btn-sm me-2">Load Activity</button>
            <button id="clear-ratings" class="btn btn-outline-danger btn-sm me-2">Delete All My Ratings</button>
            <button id="clear-comments" class="btn btn-outline-danger btn-sm me-2">Delete All My Comments</button>
            <button id="export-profile" class="btn btn-outline-secondary btn-sm">Export JSON</button>
        </div>
        <div id="profile-summary" class="row g-4" style="display:none;">
            <div class="col-md-4">
                <div class="card h-100"><div class="card-body">
                    <h5 class="card-title">Summary</h5>
                    <p class="mb-1"><strong>Ratings:</strong> <span id="ratings-count">0</span></p>
                    <p class="mb-1"><strong>Comments:</strong> <span id="comments-count">0</span></p>
                </div></div>
            </div>
            <div class="col-md-4 order-md-2">
                <div class="card h-100"><div class="card-body">
                    <h5 class="card-title">Recent Comments</h5>
                    <div id="comments-list" class="small"></div>
                    <div class="mt-2 d-flex justify-content-between align-items-center">
                        <button class="btn btn-sm btn-outline-secondary" id="comments-prev" disabled>&laquo;</button>
                        <span class="small" id="comments-page"></span>
                        <button class="btn btn-sm btn-outline-secondary" id="comments-next" disabled>&raquo;</button>
                    </div>
                </div></div>
            </div>
            <div class="col-md-4 order-md-3">
                <div class="card h-100"><div class="card-body">
                    <h5 class="card-title">Ratings</h5>
                    <div id="ratings-list" class="small"></div>
                    <div class="mt-2 d-flex justify-content-between align-items-center">
                        <button class="btn btn-sm btn-outline-secondary" id="ratings-prev" disabled>&laquo;</button>
                        <span class="small" id="ratings-page"></span>
                        <button class="btn btn-sm btn-outline-secondary" id="ratings-next" disabled>&raquo;</button>
                    </div>
                </div></div>
            </div>
        </div>
    </div>
</section>

<footer class="py-4 bg-primary text-white text-center mt-4">
    <div class="container">
        <p class="mb-0">&copy; 2025 SHMMy Students</p>
        <button id="theme-toggle" class="btn btn-outline-light ms-2">Theme</button>
        <button id="contrast-toggle" class="btn btn-outline-light btn-sm ms-2">High Contrast</button>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script src="profile.js"></script>
<script src="auth_client.js"></script>
</body>
</html>
