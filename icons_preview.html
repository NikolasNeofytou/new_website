<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Icon Review – SHMMy</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;padding:2rem;}
.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
.icon-tile{background:#fff;border:1px solid #d0d6e0;border-radius:1rem;padding:0.85rem;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.06);} 
.dark .icon-tile{background:#1e2936;border-color:#2f4154;}
.icon-tile figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.5rem;}
.icon-tile img{max-width:100%;height:auto;border-radius:22%;background:#0b1e3a;} 
.maskable-sim{position:absolute;inset:.5rem;border-radius:40%;outline:2px dashed rgba(255,255,255,.3);pointer-events:none;}
.small{font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;font-weight:600;opacity:.7;text-align:center;}
.toggle-btn{position:fixed;top:1rem;right:1rem;z-index:50;}
.bg-sample{display:flex;gap:.25rem;margin-top:.25rem;}
.bg-sample span{flex:1;height:6px;border-radius:3px;}
:root{color-scheme:light dark;}
.dark{background:#0e1621;color:#f5f7fa;}
.contrast-fail{outline:2px solid #d33;}
</style>
</head>
<body>
<button class="btn btn-sm btn-secondary toggle-btn" id="themeToggle">Toggle BG</button>
<h1 class="h4 mb-4">Icon Set Review</h1>
<p class="text-muted small mb-4">Visual QA for generated light / dark / maskable variants. This page helps check: shape integrity (rounded corners), safe zone (maskable dashed overlay), contrast on light vs dark, and size crispness.</p>
<div class="grid" id="iconGrid"></div>
<script>
const variants = [
 { prefix:'icon', sizes:[32,48,64,180,192,512] },
 { prefix:'icon-dark', sizes:[32,48,64,180,192,512] },
 { prefix:'icon-maskable', sizes:[192,512] }
];
const grid = document.getElementById('iconGrid');
variants.forEach(v=>{
  v.sizes.forEach(sz=>{
    const name = `${v.prefix}-${sz}.png`;
    const tile = document.createElement('div');
    tile.className='icon-tile';
    tile.innerHTML = `<figure><img src="icons/${name}" alt="${name}" width="${sz}" height="${sz}"><figcaption class='small'>${name}</figcaption><div class='bg-sample'><span style='background:#0b1e3a'></span><span style='background:#123c73'></span><span style='background:#c47a2c'></span><span style='background:#33d6ff'></span></div></figure>`;
    if(v.prefix.includes('maskable')){
      const overlay = document.createElement('div');
      overlay.className='maskable-sim';
      tile.appendChild(overlay);
    }
    grid.appendChild(tile);
  });
});
// Quick contrast heuristic (relative luminance) for central 1px border sample
function relativeL(r,g,b){ const sr=[r,g,b].map(v=>{v/=255;return v<=0.03928? v/12.92:Math.pow((v+0.055)/1.055,2.4);}); return 0.2126*sr[0]+0.7152*sr[1]+0.0722*sr[2]; }
function checkContrast(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const tiles=[...document.querySelectorAll('.icon-tile img')];
  tiles.forEach(img=>{
    try{
      canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
      ctx.drawImage(img,0,0);
      const d=ctx.getImageData(1,1,1,1).data; // sample corner-ish
      const bgLight = document.body.classList.contains('dark')? [14,22,33]: [255,255,255];
      const Lf = relativeL(d[0],d[1],d[2]);
      const Lb = relativeL(...bgLight);
      const contrast = (Math.max(Lf,Lb)+0.05)/(Math.min(Lf,Lb)+0.05);
      if(contrast < 2.5){ img.classList.add('contrast-fail'); img.title = 'Low contrast ~'+contrast.toFixed(2); }
      else img.classList.remove('contrast-fail');
    }catch{ /* ignore cross origin (shouldn't) */ }
  });
}
setTimeout(checkContrast,300);

document.getElementById('themeToggle').addEventListener('click',()=>{ document.body.classList.toggle('dark'); setTimeout(checkContrast,150); });
</script>
</body>
</html>
