<section class="py-5">
    <div class="container">
        <h2 class="mb-4">Create Your Profile</h2>
        <form id="profile-form" class="mb-5">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-md-2">
                    <label for="univid" class="form-label">University ID</label>
                    <input type="text" class="form-control" id="univid" required>
                </div>
                <div class="col-md-2">
                    <label for="year" class="form-label">Year</label>
                    <input type="number" class="form-control" id="year" min="1" max="10" required>
                </div>
                <div class="col-md-3">
                    <label for="spec" class="form-label">Specialisation</label>
                    <input type="text" class="form-control" id="spec" required>
                </div>
                <div class="col-md-2">
                    <label for="photo" class="form-label">Photo URL</label>
                    <input type="url" class="form-control" id="photo" required>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </form>
        <div id="profiles" class="row g-4">
            <!-- Profiles loaded via profiles.js -->
        </div>
    </div>
</section>
