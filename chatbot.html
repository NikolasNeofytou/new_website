<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Chatbot - SHMMy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    #chat-container { max-width: 800px; margin: 0 auto; }
    .chat-log { background: var(--color-bg-alt); border:1px solid var(--color-border); padding:1rem; border-radius: var(--radius-md); height:60vh; overflow-y:auto; }
    .msg { margin-bottom: .75rem; }
    .msg-user { text-align:right; }
    .bubble { display:inline-block; padding:.6rem .9rem; border-radius:18px; max-width:70%; line-height:1.3; }
    .bubble-user { background: var(--color-primary); color:#fff; }
    .bubble-bot { background: var(--color-bg); border:1px solid var(--color-border); }
    .thinking { opacity: .6; font-style: italic; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">SHMMy</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="past_papers.html">Past Papers</a></li>
        <li class="nav-item"><a class="nav-link" href="chatbot.html">Chatbot</a></li>
        <li class="nav-item" id="auth-li"><button id="auth-btn" class="btn btn-outline-light btn-sm">Sign In</button></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container py-4" id="chat-container">
  <h1 class="h4 mb-3">Helper Chatbot</h1>
  <p class="text-muted small">Ask about using the site (filters, ratings, offline mode). This runs locally—no external calls.</p>
  <div id="chat-log" class="chat-log mb-3"></div>
  <form id="chat-form" class="d-flex gap-2 flex-wrap">
    <div class="flex-grow-1 d-flex gap-2" style="flex:1 1 auto;">
      <input type="text" id="chat-input" class="form-control" placeholder="Type a question..." autocomplete="off" required />
      <button class="btn btn-primary" type="submit">Send</button>
    </div>
    <button class="btn btn-outline-secondary btn-sm" id="chat-clear" type="button">Clear History</button>
  </form>
</div>
<footer class="py-4 bg-primary text-white text-center mt-4">
  <div class="container">
  <p class="mb-0">&copy; 2025 SHMMy Students</p>
  <button id="theme-toggle" class="btn btn-outline-light ms-2"><span class="icon" aria-hidden="true"><svg class="sun" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/></g></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 14.5A8.38 8.38 0 0 1 9.5 3 7.5 7.5 0 1 0 21 14.5z"/></svg></span><span class="label">Theme</span></button>
  <button id="contrast-toggle" class="btn btn-outline-light btn-sm ms-2">High Contrast</button>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script src="chatbot.js"></script>
<script src="auth_client.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});} </script>
</body>
</html>
